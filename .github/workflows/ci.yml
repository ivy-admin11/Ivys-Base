name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Repository hygiene + compile + lint + security + tests
        run: ./scripts/check_hygiene.sh

      - name: detect-secrets (pre-commit hook against baseline)
        run: pre-commit run detect-secrets --all-files --show-diff-on-failure

      - name: Protect secrets baseline from silent modification
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          if ! git cat-file -e "origin/${GITHUB_BASE_REF}:.secrets.baseline" 2>/dev/null; then
            echo "Base branch has no .secrets.baseline yet; skipping baseline-modification guard."
            exit 0
          fi
          if ! git diff --name-only "origin/${GITHUB_BASE_REF}" -- .secrets.baseline | grep -q '^.secrets.baseline$'; then
            echo "Baseline unchanged — no manual review required."
            exit 0
          fi
          python - <<'PY'
          import collections
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          base_ref = f"origin/{os.environ['GITHUB_BASE_REF']}"
          base = json.loads(
              subprocess.check_output(
                  ["git", "show", f"{base_ref}:.secrets.baseline"],
                  text=True,
              )
          )
          head = json.loads(Path(".secrets.baseline").read_text(encoding="utf-8"))

          def fingerprint_counts(payload):
              counts = collections.Counter()
              file_counts = collections.defaultdict(collections.Counter)
              for filename, results in payload.get("results", {}).items():
                  for result in results:
                      fingerprint = (
                          result.get("type"),
                          result.get("hashed_secret"),
                      )
                      counts[fingerprint] += 1
                      file_counts[fingerprint][filename] += 1
              return counts, file_counts

          base_counts, base_file_counts = fingerprint_counts(base)
          head_counts, head_file_counts = fingerprint_counts(head)
          added = []
          for fingerprint, count in sorted(head_counts.items()):
              extra = count - base_counts.get(fingerprint, 0)
              if extra > 0:
                  filenames = []
                  for filename, filename_count in sorted(head_file_counts.get(fingerprint, {}).items()):
                      filename_extra = filename_count - base_file_counts.get(fingerprint, {}).get(filename, 0)
                      if filename_extra > 0:
                          filenames.extend([filename] * filename_extra)
                  if len(filenames) != extra:
                      print(
                          f"WARNING: expected {extra} net-new filenames for {fingerprint} "
                          f"but found {len(filenames)}"
                      )
                  for index in range(extra):
                      added.append(
                          (
                              filenames[index] if index < len(filenames) else "<unknown>",
                              fingerprint[0],
                              fingerprint[1],
                          )
                      )
          if added:
              print(
                  "::error file=.secrets.baseline::'.secrets.baseline' adds new "
                  "tracked secret fingerprints in this PR. Review the diff carefully "
                  "to ensure no real secrets were allowlisted or baselined."
              )
              for filename, secret_type, hashed_secret in added:
                  print(f"ADDED {filename} | {secret_type} | {hashed_secret}")
              sys.exit(1)

          print("Baseline cleanup-only — existing findings removed or moved, no new secrets added.")
          PY

  macos-safety:
    name: macOS osascript + launchd safety
    runs-on: macos-14
    timeout-minutes: 20
    env:
      PYTEST_MACOS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Run the safe real-osascript argv test
        run: >-
          python -m pytest -v -rs
          tests/test_ivy_core.py::test_argv_round_trip_with_tricky_characters_real_osascript

      - name: Validate launchd templates and rendered plists
        run: |
          plutil -lint deploy/launchd/*.plist.template
          ./deploy/install_launchd.sh --validate-only
