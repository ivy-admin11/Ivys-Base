name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Repository hygiene + compile + lint + security + tests
        run: ./scripts/check_hygiene.sh

      - name: detect-secrets (pre-commit hook against baseline)
        run: pre-commit run detect-secrets --all-files --show-diff-on-failure

      - name: Protect secrets baseline from silent modification
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:.secrets.baseline" 2>/dev/null; then
            echo "Base branch has no .secrets.baseline yet; skipping baseline-modification guard."
            exit 0
          fi
          python - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import subprocess
          import sys
          
          base_ref = f"origin/{os.environ['BASE_REF']}"
          base_text = subprocess.check_output(
              ["git", "show", f"{base_ref}:.secrets.baseline"],
              text=True,
          )
          head_text = pathlib.Path(".secrets.baseline").read_text(encoding="utf-8")

          def fingerprint_counts(raw_text: str) -> collections.Counter[tuple[str, str | None, str | None]]:
              baseline = json.loads(raw_text)
              counts: collections.Counter[tuple[str, str | None, str | None]] = collections.Counter()
              for filename, findings in baseline.get("results", {}).items():
                  for finding in findings:
                      counts[(filename, finding.get("type"), finding.get("hashed_secret"))] += 1
              return counts

          base_counts = fingerprint_counts(base_text)
          head_counts = fingerprint_counts(head_text)
          additions: list[tuple[str, str | None, str | None]] = []
          for fingerprint, count in head_counts.items():
              extra = count - base_counts.get(fingerprint, 0)
              if extra > 0:
                  additions.extend([fingerprint] * extra)

          if additions:
              print(
                  "::error file=.secrets.baseline::'.secrets.baseline' adds new tracked secret entries in this PR. "
                  "Review the diff carefully to ensure no real secrets were allowlisted or baselined."
              )
              for filename, finding_type, hashed_secret in additions[:20]:
                  print(f"Added baseline entry: {filename} [{finding_type}] {hashed_secret}")
              sys.exit(1)

          print("Baseline changes only remove or move existing findings; no new tracked secret entries were added.")
          PY

  macos-safety:
    name: macOS osascript + launchd safety
    runs-on: macos-14
    timeout-minutes: 20
    env:
      PYTEST_MACOS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Run the safe real-osascript argv test
        run: >-
          python -m pytest -v -rs
          tests/test_ivy_core.py::test_argv_round_trip_with_tricky_characters_real_osascript

      - name: Validate launchd templates and rendered plists
        run: |
          plutil -lint deploy/launchd/*.plist.template
          ./deploy/install_launchd.sh --validate-only
