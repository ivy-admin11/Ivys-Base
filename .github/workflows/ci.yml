name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ALLOW_INSECURE_ADMIN_SECRET: "true"
      ADMIN_SECRET: "ci-test-secret"
      HENRY_PHONE: "+15555550100"
      LEXI_PHONE: "+15555550101"
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      XAI_API_KEY: "test-xai-key-not-real"
      ODDS_API_KEY: ""
      READWISE_API_KEY: ""
      ENABLE_IMESSAGE_POLLER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from the lockfile, not the requirements ranges. CI used to
          # resolve pydantic to the 2.14.0b1 PRE-RELEASE while production ran
          # stable 2.13.4, and pinned google-genai==1.2.0 (a requests-based
          # build) while production ran 1.47.0 (httpx-based) — so CI was
          # validating a different HTTP transport than the gateway used.
          pip install -r requirements.lock.txt

      - name: Dependency conflict check
        run: pip check

      - name: compileall
        run: python -m compileall -q main.py config.py registry.py job_runner.py trigger_capabilities_alert.py cache_manager.py voice_assistant.py ivy_core proactive_agents utils tests

      - name: Secret scan (fail on committed .env or credential files)
        run: |
          if git ls-files | grep -E '(^|/)\.env$|google_credentials\.json$|token\.json$|service-account-key\.json$|(^|/)favorites\.json$'; then
            echo "A secret-shaped file is tracked in git — see the paths above." >&2
            exit 1
          fi
          echo "No tracked secret files found."

      - name: No real contact numbers in tracked files
        run: |
          # Real numbers used to sit in config.py defaults, two favorites.json
          # whitelists (11 numbers, 8 of them third parties) and a docstring.
          # Only the +1555555xxxx reserved-for-fiction range is allowed.
          if git ls-files -z | xargs -0 grep -InE '\+1[0-9]{10}' 2>/dev/null \
               | grep -vE '\+1555[0-9]{7}'; then
            echo "A real-looking phone number is tracked — use a +1555xxxxxxx number." >&2
            exit 1
          fi
          echo "No real contact numbers found."

      - name: Ruff
        run: ruff check .

      - name: Bandit
        run: bandit -r main.py config.py registry.py job_runner.py ivy_core proactive_agents utils cache_manager.py voice_assistant.py trigger_capabilities_alert.py -ll

      - name: pytest
        run: pytest -v
