name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Repository hygiene + compile + lint + security + tests
        run: ./scripts/check_hygiene.sh

      - name: detect-secrets (pre-commit hook against baseline)
        run: |
          pip install pre-commit -q
          pre-commit run detect-secrets --all-files --show-diff-on-failure

      - name: Protect secrets baseline from silent modification
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git cat-file -e "origin/${{ github.base_ref }}:.secrets.baseline" 2>/dev/null; then
            echo "Base branch has no .secrets.baseline yet; skipping baseline-modification guard."
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}" -- .secrets.baseline | grep -q '^.secrets.baseline$'; then
            echo "::error file=.secrets.baseline::'.secrets.baseline' was modified in this PR." \
                 "Review the diff carefully to ensure no real secrets were added as false positives."
            exit 1
          fi
          echo "Baseline unchanged — no manual review required."
